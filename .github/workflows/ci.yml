name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:server
      - run: npm run test:sites
      - run: npm run test:pi-update

  # Single stable gate for branch protection. Requiring the matrix jobs directly
  # would pin protection to specific Node versions, so changing the matrix later
  # would leave a required check that never reports and block every pull request.
  ci-passed:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job did not succeed
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
