name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:server
      - run: npm run test:codex
      - run: npm run test:prompts
      - run: npm run test:launcher
      - run: npm run test:sites
      - run: npm run test:pi-update

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:release
      - run: npm run test:ui

  launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Parse the Windows launcher
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath bin/pi-provider-manager.ps1 -Raw
          [void][scriptblock]::Create($source)
      # Parsing is not running. Both refusals below are the launcher's only
      # output on the two ways a first run goes wrong, and neither had ever been
      # executed by anything — the bash launcher's equivalents are covered by
      # tests/launcher.test.mjs, which cannot run PowerShell.
      - name: Explain, rather than only report, a missing checkout
        shell: pwsh
        run: |
          $env:PI_PROVIDER_MANAGER_PROJECT_DIR = Join-Path $env:TEMP "ppm-no-such-checkout"
          $message = try { & ./bin/pi-provider-manager.ps1; "it did not refuse" } catch { $_.Exception.Message }
          foreach ($expected in @(
            "The launcher looks for the checkout in this order",
            "PI_PROVIDER_MANAGER_PROJECT_DIR",
            "the current directory",
            "the directory above this script"
          )) {
            if ($message -notmatch [regex]::Escape($expected)) { throw "missing '$expected' from:`n$message" }
          }
      - name: Refuse a Node older than the manifest declares
        shell: pwsh
        run: |
          $fixture = Join-Path $env:TEMP "ppm-node-floor"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          '{"name":"pi-provider-manager-ui","engines":{"node":">=999"}}' |
            Set-Content -LiteralPath (Join-Path $fixture "package.json")
          New-Item -ItemType File -Force -Path (Join-Path $fixture "server.mjs") | Out-Null
          $env:PI_PROVIDER_MANAGER_PROJECT_DIR = $fixture
          $message = try { & ./bin/pi-provider-manager.ps1; "it did not refuse" } catch { $_.Exception.Message }
          if ($message -notmatch "needs 999 or newer") { throw "the floor was not enforced:`n$message" }
          # And a manifest with no floor must not invent one.
          '{"name":"pi-provider-manager-ui"}' |
            Set-Content -LiteralPath (Join-Path $fixture "package.json")
          $unbounded = try { & ./bin/pi-provider-manager.ps1; "" } catch { $_.Exception.Message }
          if ($unbounded -match "is too old") { throw "a floor was invented:`n$unbounded" }

      # The reuse report is the launcher's only account of an instance that is
      # already running, and without it an upgrade that was installed but never
      # restarted looks like an upgrade that failed. The bash equivalent is
      # covered by tests/launcher.test.mjs, which cannot run PowerShell — so this
      # is the only place the Windows start-and-reuse path is executed at all.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Report a reused instance rather than pretending to start one
        shell: pwsh
        run: |
          $env:PI_PROVIDER_MANAGER_OPEN_BROWSER = "0"
          $env:PI_PROVIDER_MANAGER_PORT = "43137"
          $env:PI_CODING_AGENT_DIR = Join-Path $env:TEMP "ppm-ci-agent"
          $env:PI_PROVIDER_MANAGER_CODEX_DIR = Join-Path $env:TEMP "ppm-ci-codex"
          $servicePid = 0
          try {
            $first = & ./bin/pi-provider-manager.ps1 | Out-String
            # The URL is unconditional: printing it only when no browser is opened
            # left a blocked browser bridge with no port and no error on screen.
            if ($first -notmatch "ready: http://127\.0\.0\.1:43137/") { throw "no url:`n$first" }
            if ($first -match "reused") { throw "a first start claimed a reuse:`n$first" }
            if ($first -notmatch [regex]::Escape($env:PI_CODING_AGENT_DIR)) { throw "no Pi directory:`n$first" }

            $state = Invoke-RestMethod -Uri "http://127.0.0.1:43137/api/state" -TimeoutSec 10
            $servicePid = [int]$state.compatibility.servicePid
            if ($servicePid -le 0) { throw "the server reported no process id" }

            $second = & ./bin/pi-provider-manager.ps1 | Out-String
            if ($second -notmatch "reused the instance already running") { throw "no reuse report:`n$second" }
            # The version and the process id both have to be the running
            # instance's: during an upgrade they are exactly what this launcher's
            # own directory would get wrong.
            if ($second -notmatch [regex]::Escape("version $($state.compatibility.appVersion)")) { throw "the running version is not named:`n$second" }
            if ($second -notmatch [regex]::Escape("Stop-Process -Id $servicePid")) { throw "the restart command names no pid:`n$second" }
          } finally {
            if ($servicePid -gt 0) { Stop-Process -Id $servicePid -Force -ErrorAction SilentlyContinue }
          }

  # Single stable gate for branch protection. Requiring matrix or UI jobs directly
  # would couple protection to implementation details and changing either later
  # could leave a required check that never reports and blocks every pull request.
  ci-passed:
    if: always()
    needs: [test, ui, launchers]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job did not succeed
        if: needs.test.result != 'success' || needs.ui.result != 'success' || needs.launchers.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          echo "ui result: ${{ needs.ui.result }}"
          echo "launchers result: ${{ needs.launchers.result }}"
          exit 1
