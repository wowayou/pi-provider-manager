name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:server
      - run: npm run test:sites
      - run: npm run test:pi-update

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:ui

  # Single stable gate for branch protection. Requiring matrix or UI jobs directly
  # would couple protection to implementation details and changing either later
  # could leave a required check that never reports and blocks every pull request.
  ci-passed:
    if: always()
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job did not succeed
        if: needs.test.result != 'success' || needs.ui.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          echo "ui result: ${{ needs.ui.result }}"
          exit 1
