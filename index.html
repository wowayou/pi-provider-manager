<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Pi Provider Manager</title>
    <script>
      // Resolve the theme before first paint so the app never flashes the wrong one.
      (function () {
        var resolved = "light";
        try {
          var stored = localStorage.getItem("ppm-theme");
          resolved = stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) { /* storage blocked: stay light */ }
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
